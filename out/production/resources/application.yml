server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppass}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:a54eaf001@smtp-brevo.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}

  profiles:
    default: local

app:
  jwt:
    issuer: ${JWT_ISSUER:backend1-core}
    secret: ${JWT_SECRET:CHANGE_ME_TO_LONG_RANDOM_SECRET_CHANGE_ME}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}

  email:
    from: ${MAIL_FROM:wjsckddhks99@gmail.com}
    verification:
      ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:10}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  refresh:
    days: ${REFRESH_TOKEN_DAYS:30}
    pepper: ${REFRESH_TOKEN_PEPPER:${JWT_SECRET:CHANGE_ME_TO_LONG_RANDOM_SECRET_CHANGE_ME}}

upload:
  max-files: ${UPLOAD_MAX_FILES:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  retry:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${AI_RETRY_DELAY_MS:300}
    multiplier: ${AI_RETRY_MULTIPLIER:2.0}

storage:
  local:
    root: ${STORAGE_LOCAL_ROOT:./storage}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

report:
  share:
    minutes: ${REPORT_SHARE_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true